    <text x="40" y="34" fill="white" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="500">Something came up that</text>
    <text x="40" y="56" fill="white" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="500">they couldn&apos;t control.</text>
