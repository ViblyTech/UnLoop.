    <text x="155" y="148" text-anchor="middle" fill="rgba(255,255,255,0.95)" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="500">with no reason given.</text>
    <text x="155" y="180" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="-apple-system, system-ui, sans-serif" font-size="13">How do you read it?</text>
