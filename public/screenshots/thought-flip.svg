    <text x="40" y="34" fill="rgba(255,255,255,0.7)" font-family="-apple-system, system-ui, sans-serif" font-size="15">They&apos;re avoiding you</text>
    <text x="40" y="56" fill="rgba(255,255,255,0.7)" font-family="-apple-system, system-ui, sans-serif" font-size="15">on purpose.</text>
